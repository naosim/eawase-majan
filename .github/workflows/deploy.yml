name: Deploy to Sakura Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build subdirectory deployment package
        run: sh scripts/build-deploy-package.sh "$GITHUB_WORKSPACE/dist"

      - name: Sync deployment package via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: dist/
          exclude: |
            .git/**
            .github/**
            design_spec.md
            data/**